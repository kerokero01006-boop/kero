<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إدارة المخزن</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef1f4;--card:#fff;--tx:#18222e;--mut:#5f6b7a;--br:#d9dee5;--pr:#0b6b63;--prt:#fff;--dg:#b42318;--wr:#b54708;--hd:#17303b;--hdt:#f2f7f8}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--card:#18202a;--tx:#e6ebf1;--mut:#9aa6b5;--br:#2a3541;--pr:#35c9b8;--prt:#05211d;--dg:#f97066;--wr:#fdb022;--hd:#0b1116;--hdt:#e6ebf1}}
:root[data-theme="dark"]{--bg:#10151b;--card:#18202a;--tx:#e6ebf1;--mut:#9aa6b5;--br:#2a3541;--pr:#35c9b8;--prt:#05211d;--dg:#f97066;--wr:#fdb022;--hd:#0b1116;--hdt:#e6ebf1}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;font-size:15px;line-height:1.6}
[hidden]{display:none!important}
header{background:var(--hd);color:var(--hdt);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
#st{font-size:13px;opacity:.9}
.hb{display:flex;gap:6px}.hb button{padding:6px 12px;font-size:13px;background:var(--pr);color:var(--prt);border:0;border-radius:6px;cursor:pointer;font-weight:600}
header h1{margin:0;font-size:20px;font-weight:700}
nav{display:flex;gap:4px;overflow-x:auto;background:var(--hd);padding:0 12px}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--hdt);opacity:.7;padding:10px 14px;font:inherit;font-weight:600;white-space:nowrap;cursor:pointer}
nav button.on{opacity:1;border-bottom-color:var(--pr)}
main{max-width:1100px;margin:0 auto;padding:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.c{background:var(--card);border:1px solid var(--br);border-radius:8px;padding:12px 14px}
.c small{color:var(--mut);display:block}
.c b{font-size:22px}
h2{font-size:17px;margin:18px 0 8px}
.bar{display:flex;gap:8px;margin-bottom:10px}
.bar input{flex:1}
input,select,button,textarea{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--br);border-radius:6px;background:var(--card)}
button{padding:8px 14px;border:1px solid var(--br);border-radius:6px;background:var(--card);cursor:pointer}
button.pr{background:var(--pr);color:var(--prt);border-color:var(--pr);font-weight:600}
button.dg{color:var(--dg)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pr);outline-offset:1px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--br);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--br);white-space:nowrap}
th{background:var(--bg);color:var(--mut);font-weight:600;font-size:13px}
tr:last-child td{border-bottom:0}
td.em{text-align:center;color:var(--mut);padding:26px}
td.act{display:flex;gap:4px}
td.act button{padding:3px 9px;font-size:13px}
.lo{color:var(--wr)}
.lk{border:0;background:none;padding:0;color:var(--pr);font-weight:600;text-decoration:underline;cursor:pointer}
.hd{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.hd h2{margin:0;flex:1}
.pos{color:var(--pr)}
.neg{color:var(--dg)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));z-index:20}
.box{background:var(--card);border-radius:10px;padding:18px;width:min(440px,100%);max-height:100%;overflow:auto}
.box h3{margin:0 0 10px}
.box label{display:block;margin-bottom:10px;color:var(--mut);font-size:13px}
.box label input,.box label select{margin-top:3px;color:var(--tx);font-size:15px}
.row{display:flex;gap:8px;margin-top:6px}
#toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--hd);color:var(--hdt);padding:9px 16px;border-radius:8px;z-index:30}
textarea{min-height:70px;font-size:12px;direction:ltr}
</style>
<script src=https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js></script>
<script src=https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js></script>
</head>
<body>
<header><h1>📦 إدارة المخزن</h1><span id="st"></span><div class=hb><button id=bsv>💾 حفظ</button><button id=bwp>🗑 مسح</button><button id=bimp>📥 استيراد</button><button id=brp>📄 تقرير</button></div></header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="m" class="ov" hidden></div>
<div id="toast" hidden></div>
<script>
var K='warehouse-v1',tab='dash',q='',pk='',pid='',cd='';
window.ROLE=null;window.ME=null;window.USERS=[];
var db={products:[],customers:[],suppliers:[],purchases:[],sales:[],payments:[],cash:[]};
try{var s=localStorage.getItem(K);if(s)db=Object.assign(db,JSON.parse(s))}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}if(DBH){if(SYNC.first)queueSync();else SYNC.dirty=true}}
var $=function(x){return document.querySelector(x)};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)};
var fmt=function(n){return (+n||0).toLocaleString('en-US',{maximumFractionDigits:2})};
var today=function(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var find=function(t,id){return db[t].find(function(x){return x.id===id})};
var nm=function(t,id){var r=find(t,id);return r?esc(r.name):'—'};
var tot=function(x){return x.qty*x.price};
function owed(k,id){
  var t=k==='customers'?'sales':'purchases',f=k==='customers'?'customerId':'supplierId';
  return db[t].filter(function(x){return x[f]===id}).reduce(function(a,x){return a+tot(x)-x.paid},0)
   -db.payments.filter(function(p){return p.party===id}).reduce(function(a,p){return a+p.amount},0);
}
var TABS=[['dash','الرئيسية'],['products','المنتجات'],['customers','العملاء'],['suppliers','الوكلاء'],['purchases','المشتريات'],['sales','المبيعات'],['cash','الخزنة']];
var T={products:'منتج',customers:'عميل',suppliers:'وكيل',purchases:'عملية شراء',sales:'عملية بيع'};
var COLS={
 products:[['الاسم',function(r){return esc(r.name)}],['الوحدة',function(r){return esc(r.unit)}],['سعر الشراء',function(r){return fmt(r.cost)}],['سعر البيع',function(r){return fmt(r.price)}],['الكمية',function(r){return r.qty<=r.min?'<b class="lo">'+fmt(r.qty)+' ⚠</b>':fmt(r.qty)}],['حد الطلب',function(r){return fmt(r.min)}]],
 customers:[['الاسم',function(r){return '<button class="lk" onclick="party(\'customers\',\''+r.id+'\')">'+esc(r.name)+'</button>'}],['الهاتف',function(r){return esc(r.phone)}],['العنوان',function(r){return esc(r.address)}],['المستحق عليه',function(r){return fmt(owed('customers',r.id))}]],
 suppliers:[['الاسم',function(r){return '<button class="lk" onclick="party(\'suppliers\',\''+r.id+'\')">'+esc(r.name)+'</button>'}],['الهاتف',function(r){return esc(r.phone)}],['الشركة',function(r){return esc(r.company)}],['عليّ له',function(r){return sg(-owed('suppliers',r.id))}]],
 purchases:[['التاريخ',function(r){return r.date}],['الوكيل',function(r){return nm('suppliers',r.supplierId)}],['المنتج',function(r){return nm('products',r.productId)}],['الكمية',function(r){return fmt(r.qty)}],['سعر الوحدة',function(r){return fmt(r.price)}],['الإجمالي',function(r){return sg(-tot(r))}],['المدفوع',function(r){return fmt(r.paid)}],['المتبقي',function(r){return sg(-(tot(r)-r.paid))}]],
 sales:[['التاريخ',function(r){return r.date}],['العميل',function(r){return nm('customers',r.customerId)}],['المنتج',function(r){return nm('products',r.productId)}],['الكمية',function(r){return fmt(r.qty)}],['سعر الوحدة',function(r){return fmt(r.price)}],['الإجمالي',function(r){return fmt(tot(r))}],['المدفوع',function(r){return fmt(r.paid)}],['المتبقي',function(r){return fmt(tot(r)-r.paid)}]]
};
var F={
 products:[['name','اسم المنتج','text'],['unit','الوحدة (قطعة، كرتونة...)','text'],['cost','سعر الشراء','number'],['price','سعر البيع','number'],['qty','الكمية الحالية','number'],['min','حد إعادة الطلب','number']],
 customers:[['name','اسم العميل','text'],['phone','الهاتف','text'],['address','العنوان','text']],
 suppliers:[['name','اسم الوكيل','text'],['phone','الهاتف','text'],['company','الشركة','text']],
 purchases:[['date','التاريخ','date'],['supplierId','الوكيل','suppliers'],['productId','المنتج','products'],['qty','الكمية','number'],['price','سعر الوحدة','number'],['paid','المدفوع','number']],
 sales:[['date','التاريخ','date'],['customerId','العميل','customers'],['productId','المنتج','products'],['qty','الكمية','number'],['price','سعر الوحدة','number'],['paid','المدفوع','number']]
};
var SEL=['products','customers','suppliers'];

function toast(t){var e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(window._t);window._t=setTimeout(function(){e.hidden=true},2600)}
function modal(h){$('#m').innerHTML='<div class="box">'+h+'</div>';$('#m').hidden=false}
function closeM(){$('#m').hidden=true}
function ask(msg,cb){window._cb=cb;modal('<p>'+msg+'</p><div class="row"><button class="pr" onclick="closeM();_cb()">تأكيد</button><button onclick="closeM()">إلغاء</button></div>')}


var ROLE_AR={admin:'مدير',lawyer:'محامي',staff:'موظف',editor:'محرر المخزن',viewer:'مشاهدة فقط'};
function roleSelect(id,selected){
 return '<select id="'+id+'">'+Object.keys(ROLE_AR).map(function(k){return '<option value="'+k+'"'+(k===selected?' selected':'')+'>'+ROLE_AR[k]+'</option>'}).join('')+'</select>';
}
function permissionsPage(){
 var rows=(window.USERS||[]).map(function(u){
  return '<tr><td>'+esc(u.name||'—')+'</td><td>'+esc(u.email||'—')+'</td><td>'+esc(ROLE_AR[u.role]||u.role||'—')+'</td><td><button onclick="changePermission(\''+u.uid+'\')">تغيير الصلاحية</button> <button class="dg" onclick="removePermission(\''+u.uid+'\')">مسح الصلاحية</button></td></tr>';
 }).join('')||'<tr><td colspan="4" class="em">لا يوجد مستخدمون لديهم صلاحيات.</td></tr>';
 return '<div class="bar"><button class="pr" onclick="newPermissionUser()">+ إضافة مستخدم وصلاحية</button><button onclick="refreshPermissions()">تحديث القائمة</button></div>'
 +'<div class="tw"><table><thead><tr><th>الاسم</th><th>الإيميل</th><th>الصلاحية</th><th>إجراءات</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
 +'<div class="card" style="margin-top:14px"><b>الأدوار:</b><br>مدير: إدارة الصلاحيات بالكامل.<br>محرر المخزن: تعديل المخزن حسب قواعد Firebase.<br>مشاهدة فقط: عرض البيانات دون تعديل (حسب قواعد Firebase).</div>';
}
function refreshPermissions(){
 if(!window.ROLE||window.ROLE!=='admin')return alert('هذه الصفحة للمدير فقط');
 if(window.PERMS)window.PERMS.load().catch(function(e){alert('تعذر قراءة المستخدمين: '+(e.message||e))});
}
function newPermissionUser(){
 modal('<h3>إضافة مستخدم وصلاحية</h3>'
 +'<label>الاسم<input id="perm_name" autocomplete="name"></label>'
 +'<label>الإيميل<input id="perm_email" type="email" autocomplete="email"></label>'
 +'<label>كلمة المرور (6 أحرف على الأقل)<input id="perm_password" type="password" autocomplete="new-password"></label>'
 +'<label>الصلاحية'+roleSelect('perm_role','editor')+'</label>'
 +'<div class="row"><button class="pr" onclick="createPermissionUser()">إضافة</button><button onclick="closeM()">إلغاء</button></div>');
}
async function createPermissionUser(){
 var name=$('#perm_name').value.trim(),email=$('#perm_email').value.trim(),password=$('#perm_password').value,role=$('#perm_role').value;
 if(!name||!email||password.length<6)return alert('اكتب الاسم والإيميل وكلمة مرور 6 أحرف على الأقل');
 try{
  await window.PERMS.addUser(name,email,password,role);
  closeM();refreshPermissions();alert('تم إنشاء المستخدم وإعطاؤه الصلاحية');
 }catch(e){alert('تعذر إنشاء المستخدم: '+(e.code||e.message))}
}
function changePermission(uid){
 var u=(window.USERS||[]).find(function(x){return x.uid===uid})||{};
 modal('<h3>تغيير صلاحية '+esc(u.name||u.email||'المستخدم')+'</h3>'
 +'<label>الصلاحية'+roleSelect('perm_change_role',u.role||'viewer')+'</label>'
 +'<div class="row"><button class="pr" onclick="savePermissionRole(\''+uid+'\')">حفظ</button><button onclick="closeM()">إلغاء</button></div>');
}
async function savePermissionRole(uid){
 try{await window.PERMS.setRole(uid,$('#perm_change_role').value);closeM();refreshPermissions();alert('تم تغيير الصلاحية')}
 catch(e){alert('تعذر تغيير الصلاحية: '+(e.message||e))}
}
function removePermission(uid){
 if(uid===window.ME)return alert('لا يمكنك مسح صلاحيتك الحالية');
 ask('سيتم مسح صلاحية هذا المستخدم ومنعه من الدخول إلى الأقسام المحمية. هل تريد المتابعة؟',async function(){
  try{await window.PERMS.removeRole(uid);refreshPermissions();alert('تم مسح الصلاحية')}
  catch(e){alert('تعذر مسح الصلاحية: '+(e.message||e))}
 });
}
window.render=render;
function render(){
  var tabs=TABS.concat(window.ROLE==='admin'?[['permissions','المستخدمين والصلاحيات']]:[]);
  $('#nav').innerHTML=tabs.map(function(t){return '<button class="'+(t[0]===(tab==='party'?pk:tab)?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join('');
  $('#main').innerHTML=tab==='dash'?dash():tab==='party'?partyPage():tab==='cash'?cashPage():tab==='permissions'?permissionsPage():list(tab);
}
function go(t){tab=t;q='';render()}
function keep(){render();var e=$('#q');e.focus();e.setSelectionRange(q.length,q.length)}

function list(t){
  var C=COLS[t],isT=t==='sales'||t==='purchases';
  var rows=db[t].filter(function(r){return !q||C.map(function(c){return String(c[1](r))}).join(' ').toLowerCase().indexOf(q.toLowerCase())>-1});
  if(isT)rows=rows.slice().reverse();
  var body=rows.map(function(r){
    var a='';
    if(!isT)a+='<button onclick="openForm(\''+t+'\',\''+r.id+'\')">تعديل</button>';
    if(t==='customers'||t==='suppliers')a+='<button onclick="pay(\''+t+'\',\''+r.id+'\')">دفعة</button>';
    a+='<button class="dg" onclick="del(\''+t+'\',\''+r.id+'\')">حذف</button>';
    return '<tr>'+C.map(function(c){return '<td>'+c[1](r)+'</td>'}).join('')+'<td class="act">'+a+'</td></tr>';
  }).join('')||'<tr><td colspan="'+(C.length+1)+'" class="em">لا توجد بيانات. اضغط «إضافة» للبدء.</td></tr>';
  return '<div class="bar"><input id="q" placeholder="بحث..." value="'+esc(q)+'" oninput="q=this.value;keep()"><button class="pr" onclick="openForm(\''+t+'\')">+ إضافة '+T[t]+'</button></div>'
   +'<div class="tw"><table><thead><tr>'+C.map(function(c){return '<th>'+c[0]+'</th>'}).join('')+'<th></th></tr></thead><tbody>'+body+'</tbody></table></div>';
}

function dash(){
  var stock=db.products.reduce(function(a,p){return a+p.qty*p.cost},0);
  var sum=function(t){return db[t].reduce(function(a,x){return a+tot(x)},0)};
  var cd=db.customers.reduce(function(a,c){return a+owed('customers',c.id)},0);
  var sd=db.suppliers.reduce(function(a,c){return a+owed('suppliers',c.id)},0);
  var low=db.products.filter(function(p){return p.qty<=p.min});
  var cards=[['عدد المنتجات',db.products.length],['قيمة المخزون',fmt(stock)],['إجمالي المبيعات',fmt(sum('sales'))],['إجمالي المشتريات',sg(-sum('purchases'))],['مستحق على العملاء',fmt(cd)],['عليّ للوكلاء',sg(-sd)],['مصروفات الخزنة',sg(-cx('out'))],['الصافي (مبيعات − مشتريات − مصروفات)',sg(sum('sales')-sum('purchases')-cx('out'))],['رصيد الخزنة',sg(cashNet())],['الرصيد بعد الديون',sg(cashNet()-sd)]];
  return '<div class="cards">'+cards.map(function(c){return '<div class="c"><small>'+c[0]+'</small><b>'+c[1]+'</b></div>'}).join('')+'</div>'
   +'<h2>منتجات وصلت لحد الطلب</h2>'
   +(low.length?'<div class="tw"><table><thead><tr><th>المنتج</th><th>الكمية</th><th>حد الطلب</th></tr></thead><tbody>'+low.map(function(p){return '<tr><td>'+esc(p.name)+'</td><td class="lo">'+fmt(p.qty)+'</td><td>'+fmt(p.min)+'</td></tr>'}).join('')+'</tbody></table></div>':'<div class="c">كل المنتجات فوق حد الطلب.</div>')
   +'<h2>نسخة احتياطية</h2><div class="c"><p style="margin-top:0;color:var(--mut)">'+bkInfo()+'</p><textarea id="bk"></textarea><div class="row"><button onclick="exp()">تصدير نص</button><button onclick="imp()">استيراد نص</button><button onclick="dlBk()">حفظ كملف</button></div>'+bkList()+'</div>';
}
function exp(){$('#bk').value=JSON.stringify(db);$('#bk').select()}
function imp(){
  try{var d=JSON.parse($('#bk').value);if(!d.products)throw 0;
    ask('سيتم استبدال كل البيانات الحالية. متأكد؟',function(){db=Object.assign({products:[],customers:[],suppliers:[],purchases:[],sales:[],payments:[],cash:[]},d);save();toast('تم الاستيراد');render()});
  }catch(e){toast('النص غير صالح')}
}

function openForm(t,id,pre){
  var r=id?find(t,id):Object.assign({date:today()},pre||{});
  var body=F[t].map(function(f){
    var k=f[0],ty=f[2],inp;
    if(SEL.indexOf(ty)>-1){
      inp='<select id="f_'+k+'"'+(k==='productId'?' onchange="prefill(\''+t+'\')"':'')+'><option value="">— اختر —</option>'+db[ty].map(function(x){return '<option value="'+x.id+'"'+(x.id===r[k]?' selected':'')+'>'+esc(x.name)+'</option>'}).join('')+'</select>';
    }else inp='<input id="f_'+k+'" type="'+ty+'"'+(ty==='number'?' step="any" min="0" inputmode="decimal"':'')+' value="'+esc(r[k]==null?'':r[k])+'">';
    return '<label>'+f[1]+inp+'</label>';
  }).join('');
  modal('<h3>'+(id?'تعديل':'إضافة')+' '+T[t]+'</h3>'+body+'<div class="row"><button class="pr" onclick="submit(\''+t+'\',\''+(id||'')+'\')">حفظ</button><button onclick="closeM()">إلغاء</button></div>');
}
function prefill(t){
  var p=find('products',$('#f_productId').value);
  if(p&&!+$('#f_price').value)$('#f_price').value=t==='sales'?p.price:p.cost;
}
function submit(t,id){
  var o={};
  F[t].forEach(function(f){var v=$('#f_'+f[0]).value.trim();o[f[0]]=f[2]==='number'?(+v||0):v});
  if(SEL.length&&['products','customers','suppliers'].indexOf(t)>-1){
    if(!o.name)return toast('الاسم مطلوب');
    if(id)Object.assign(find(t,id),o);else db[t].push(Object.assign({id:uid()},o));
    save();closeM();render();return;
  }
  var party=t==='sales'?o.customerId:o.supplierId;
  if(!party||!o.productId)return toast('اختر الطرف والمنتج');
  if(o.qty<=0)return toast('الكمية لازم تكون أكبر من صفر');
  var p=find('products',o.productId);
  if(t==='sales'&&o.qty>p.qty){closeM();return ask('الكمية أكبر من المتاح في المخزن ('+fmt(p.qty)+'). تكمل؟',function(){commit(t,o)})}
  commit(t,o);
}
function commit(t,o){

function ST(o){return JSON.stringify(o,function(k,v){if(v&&typeof v==='object'&&!Array.isArray(v)){var s={};Object.keys(v).sort().forEach(function(q){s[q]=v[q]});return s}return v})}
function blank(){return {products:[],customers:[],suppliers:[],purchases:[],sales:[],payments:[],cash:[]}}

function sameMap(a,b){var k=Object.keys(a);return k.length===Object.keys(b).length&&k.every(function(x){return a[x]===b[x]})}

function queueSync(){SYNC.pend=true;if(!SYNC.busy)runSync()}
async function runSync(){
  SYNC.busy=true;setStatus('saving');

  try{
    while(SYNC.pend){
      SYNC.pend=false;
      var ops=[];
      CL.forEach(function(c){
        var cur=curMap(c);
        Object.keys(cur).forEach(function(id){if(rem[c][id]!==cur[id])ops.push(['set',c,id,cur[id]])});
        Object.keys(rem[c]).forEach(function(id){if(!(id in cur))ops.push(['del',c,id])});
      });
      for(var i=0;i<ops.length;i++)await doOp(ops[i]);
    }
  }catch(e){ok=false;clearTimeout(SYNC.retry);SYNC.retry=setTimeout(queueSync,15000)}
  SYNC.busy=false;SYNC.quiet=Date.now()+1500;
  setStatus(ok?'ok':'err');

async function doOp(o){
  var ref=DBH.doc(o[1]+'/'+o[2]),n=0;
  for(;;){
    try{
      if(o[0]==='set'){await ref.set(JSON.parse(o[3]));rem[o[1]][o[2]]=o[3]}
      else{await ref.delete();delete rem[o[1]][o[2]]}
      return;
    }catch(e){
      var cd=e&&e.code;
      if((cd==='resource_exhausted'||cd==='unavailable')&&n<5){n++;await new Promise(function(r){setTimeout(r,800*n)});continue}
      throw e;
    }
  }
}
function onSnap(c,snap){
  var m={},arr=[];
  snap.docs.forEach(function(d){var x=d.data();if(!x)return;x=JSON.parse(JSON.stringify(x));if(!x.id)x.id=d.id;arr.push(x);m[d.id]=ST(x)});
  SYNC.snap[c]={m:m,arr:arr,fresh:!snap.metadata.fromCache};
  if(!SYNC.first){checkFirst();return}
  if(SYNC.busy||SYNC.pend||SYNC.st==='err'||Date.now()<SYNC.quiet||snap.metadata.hasPendingWrites)return;
  var s=SYNC.snap[c];
  if(sameMap(s.m,rem[c]))return;
  rem[c]=Object.assign({},s.m);db[c]=s.arr.slice();

  var a=document.activeElement;if(!(a&&a.id==='q'))render();

function checkFirst(){
  if(SYNC.first||SYNC.ask)return;
  if(!CL.every(function(c){return SYNC.snap[c]&&SYNC.snap[c].fresh}))return;
  var srv=0,loc=0;
  CL.forEach(function(c){srv+=Object.keys(SYNC.snap[c].m).length;loc+=db[c].length});
  if(srv===0){
    CL.forEach(function(c){rem[c]={}});SYNC.first=true;
    if(loc>0){toast('جاري رفع بياناتك للسيرفر');queueSync()}else setStatus('ok');
  }else if(SYNC.dirty&&loc>0&&!sameAsSrv()){
    SYNC.ask=true;pushBk(ST(db));pushBk(ST(srvDb()));conflictAsk();
  }else{
    if(loc>0&&!sameAsSrv())pushBk(ST(db));
    takeSrv();
  }
}

const auth=getAuth(app),rdb=getDatabase(app),ROOT='warehouse';
window.PERMS={
 load:async function(){
  const snap=await new Promise((resolve,reject)=>onValue(ref(rdb,'roles'),resolve,reject,{onlyOnce:true}));
  window.USERS=Object.entries(snap.val()||{}).map(([uid,data])=>Object.assign({uid:uid},data||{}));
  if(window.tab==='permissions')window.render();
 },
 addUser:async function(name,email,password,role){
  const secondaryApp=initializeApp(firebaseConfig,'permission-user-'+Date.now());
  const secondaryAuth=getAuth(secondaryApp);
  try{
   const credential=await createUserWithEmailAndPassword(secondaryAuth,email,password);
   await set(ref(rdb,'roles/'+credential.user.uid),{name:name,email:email.toLowerCase(),role:role});
   await signOut(secondaryAuth);
  }finally{await deleteApp(secondaryApp)}
 },
 setRole:async function(uid,role){await set(ref(rdb,'roles/'+uid+'/role'),role)},
 removeRole:async function(uid){await remove(ref(rdb,'roles/'+uid))}
};
function adapter(){return{
 doc(p){const r=ref(rdb,ROOT+'/'+p);return{set:d=>set(r,d),delete:()=>remove(r)}},
 collection(c){return{onSnapshot(next,err){return onValue(ref(rdb,ROOT+'/'+c),s=>{const v=s.val()||{};next({docs:Object.keys(v).map(id=>({id,data:()=>v[id]})),metadata:{fromCache:false,hasPendingWrites:false}})},e=>{if(err)err({code:'revoked',message:e.message})})}}}
}}
const lg=document.createElement('div');
lg.id='lg';lg.style.cssText='position:fixed;inset:0;background:#eef1f4;display:flex;align-items:center;justify-content:center;z-index:50;font-family:Tahoma,Arial,sans-serif';
lg.innerHTML=`<form id=lf style="background:#fff;padding:24px;border-radius:10px;width:min(340px,92%)"><h3 style="margin-top:0">تسجيل الدخول</h3><input id=le type=email required placeholder="الإيميل" style="width:100%;padding:9px;margin:6px 0;box-sizing:border-box"><input id=lp type=password required placeholder="كلمة السر" style="width:100%;padding:9px;margin:6px 0;box-sizing:border-box"><button style="width:100%;padding:10px;background:#0b6b63;color:#fff;border:0;border-radius:6px;margin-top:6px">دخول</button><p id=lm style="color:#b42318;min-height:18px"></p></form>`;
document.body.appendChild(lg);
document.getElementById('lf').onsubmit=async function(e){e.preventDefault();document.getElementById('lm').textContent='';try{await signInWithEmailAndPassword(auth,document.getElementById('le').value.trim(),document.getElementById('lp').value)}catch(x){document.getElementById('lm').textContent='الإيميل أو كلمة السر غلط'}};
function addOut(){if(document.getElementById('lo'))return;var b=document.createElement('button');b.id='lo';b.textContent='خروج';b.onclick=function(){signOut(auth)};document.querySelector('header').appendChild(b)}
onAuthStateChanged(auth,function(u){
 if(u){
  lg.style.display='none';window.FBH=adapter();if(window.initDb)window.initDb();addOut();
  window.ME=u.uid;window.ROLE=null;window.USERS=[];
  onValue(ref(rdb,'roles/'+u.uid),function(s){
   var roleData=s.val();
   if(roleData&&roleData.role){
    window.ROLE=roleData.role;
    if(window.ROLE==='admin')refreshPermissions();
    render();
   }else{
    window.ROLE='viewer';render();
   }
  },function(err){console.error('Role lookup failed',err);window.ROLE='viewer';render()});
 }else{
  lg.style.display='flex';window.FBH=null;window.ME=null;window.ROLE=null;window.USERS=[];
  tab='dash';render();
 }
});
</script>
